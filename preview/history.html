<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>History - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f172a; color: #f8fafc; } .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }</style>
</head>
<body class="py-5">
    <div class="container">
        <a href="dashboard.html" class="btn btn-outline-secondary mb-4">Back to Dashboard</a>
        <h2 class="fw-bold mb-4">Transaction History</h2>
        <div class="glass-card p-4">
            <table class="table table-dark table-hover mb-0">
                <thead><tr><th>Type</th><th>Amount</th><th>Wallet</th><th>Status</th><th>Date</th></tr></thead>
                <tbody>
                    <tr><td><span class="badge bg-success bg-opacity-10 text-success">Deposit</span></td><td class="fw-bold">$100.00</td><td class="text-muted">Deposit Balance</td><td><span class="text-success small">Completed</span></td><td class="text-muted">Today</td></tr>
                    <tr><td><span class="badge bg-danger bg-opacity-10 text-danger">Withdrawal</span></td><td class="fw-bold">$50.00</td><td class="text-muted">ROI Balance</td><td><span class="text-warning small">Pending</span></td><td class="text-muted">Yesterday</td></tr>
                    <tr><td><span class="badge bg-info bg-opacity-10 text-info">ROI</span></td><td class="fw-bold">$3.00</td><td class="text-muted">ROI Balance</td><td><span class="text-success small">Completed</span></td><td class="text-muted">Oct 14</td></tr>
                    <tr><td><span class="badge bg-primary bg-opacity-10 text-primary">Commission</span></td><td class="fw-bold">$20.00</td><td class="text-muted">Referral Balance</td><td><span class="text-success small">Completed</span></td><td class="text-muted">Oct 10</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
