<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Investments - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f172a; color: #f8fafc; } .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }</style>
</head>
<body class="py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a href="dashboard.html" class="btn btn-sm btn-outline-secondary mb-2">Back to Dashboard</a>
                <h2 class="fw-bold mb-0">Investment Plans</h2>
            </div>
            <div class="text-end"><span class="text-muted small">Available Balance</span><h4 class="text-success fw-bold">$50.00</h4></div>
        </div>

        <div class="row g-4">
            <div class="col-md-3">
                <div class="glass-card h-100 d-flex flex-column text-center position-relative">
                    <div class="p-4 border-bottom border-secondary"><h4 class="fw-bold text-white mb-0">Starter</h4></div>
                    <div class="p-4">
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Min</span><span class="fw-bold">$25</span></div>
                        <div class="d-flex justify-content-between mb-3"><span class="text-muted">Max</span><span class="fw-bold">$100</span></div>
                        <div class="p-2 bg-info bg-opacity-10 border border-info rounded mb-4 text-info fw-bold">1.5% - 3.0% Daily</div>
                        <input type="number" class="form-control bg-dark border-secondary text-white mb-3" placeholder="Amount">
                        <button class="btn btn-primary w-100 fw-bold">Invest Now</button>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="glass-card h-100 d-flex flex-column text-center position-relative">
                    <div class="position-absolute top-0 end-0 bg-warning text-dark px-2 fw-bold" style="border-bottom-left-radius:10px">POPULAR</div>
                    <div class="p-4 border-bottom border-secondary"><h4 class="fw-bold text-white mb-0">Standard</h4></div>
                    <div class="p-4">
                        <div class="d-flex justify-content-between mb-2"><span class="text-muted">Min</span><span class="fw-bold">$101</span></div>
                        <div class="d-flex justify-content-between mb-3"><span class="text-muted">Max</span><span class="fw-bold">$500</span></div>
                        <div class="p-2 bg-info bg-opacity-10 border border-info rounded mb-4 text-info fw-bold">2.0% - 4.0% Daily</div>
                        <input type="number" class="form-control bg-dark border-secondary text-white mb-3" placeholder="Amount">
                        <button class="btn btn-primary w-100 fw-bold">Invest Now</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
