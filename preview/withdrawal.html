<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Withdrawal - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f172a; color: #f8fafc; } .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }</style>
</head>
<body class="py-5">
    <div class="container">
        <a href="dashboard.html" class="btn btn-outline-secondary mb-4">Back to Dashboard</a>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="glass-card p-4">
                    <h3 class="fw-bold mb-4">Withdraw Funds</h3>
                    <div class="d-flex justify-content-between mb-4 p-3 border rounded"><span class="text-muted">Total Available:</span><span class="fw-bold text-success fs-5">$370.50</span></div>
                    <form action="history.html">
                        <div class="mb-3">
                            <label class="form-label text-muted small fw-bold">Withdraw From</label>
                            <select class="form-select bg-dark border-secondary text-white"><option>ROI Wallet ($220.50)</option><option>Referral Wallet ($150.00)</option></select>
                        </div>
                        <div class="mb-3"><label class="form-label text-muted small fw-bold">Amount (USD)</label><input type="number" class="form-control bg-transparent text-white" value="50"></div>
                        <div class="mb-4"><label class="form-label text-muted small fw-bold">Your USDT (TRC20) Address</label><input type="text" class="form-control bg-transparent text-white font-monospace" placeholder="T..."></div>
                        <button type="submit" class="btn btn-warning w-100 py-2 fw-bold text-dark">Request Withdrawal</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
