<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Admin Login - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f172a; color: #f8fafc; } .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }</style>
</head>
<body class="d-flex align-items-center min-vh-100">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="glass-card p-5 border-danger border-opacity-50">
                    <h3 class="fw-bold text-danger mb-4"><i class="bi bi-shield-lock"></i> Admin Gateway</h3>
                    <form action="admin-dashboard.html">
                        <div class="mb-3"><label class="form-label text-muted small fw-bold">Email</label><input type="email" class="form-control bg-transparent text-white" value="admin@admin.com"></div>
                        <div class="mb-4"><label class="form-label text-muted small fw-bold">Password</label><input type="password" class="form-control bg-transparent text-white" value="password123"></div>
                        <button type="submit" class="btn btn-danger w-100 fw-bold">Secure Login</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
