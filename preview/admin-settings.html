<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <title>Admin Settings - Preview</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>body { background-color: #0f172a; color: #f8fafc; } .glass-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 1rem; }</style>
</head>
<body class="py-5">
    <div class="container">
        <a href="admin-dashboard.html" class="btn btn-outline-secondary mb-4">Back</a>
        <h2 class="fw-bold mb-4">Platform Settings</h2>
        <div class="row">
            <div class="col-md-8">
                <div class="glass-card p-4">
                    <form action="admin-dashboard.html">
                        <h5 class="fw-bold border-bottom pb-2">Global Constraints</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6"><label class="small text-muted fw-bold">Min Withdrawal ($)</label><input type="number" class="form-control bg-dark text-white" value="10"></div>
                            <div class="col-md-6"><label class="small text-muted fw-bold">Sign-up Bonus ($)</label><input type="number" class="form-control bg-dark text-white" value="10"></div>
                            <div class="col-md-6"><label class="small text-muted fw-bold">Max Bonus Users</label><input type="number" class="form-control bg-dark text-white" value="1000"></div>
                        </div>

                        <h5 class="fw-bold border-bottom pb-2">Features (3X & WhatsApp)</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-6"><label class="small text-muted fw-bold">Return Multiplier (e.g. 3X)</label><input type="number" class="form-control bg-dark text-white" value="3"></div>
                            <div class="col-md-6"><label class="small text-muted fw-bold">Enable Multiplier</label><select class="form-select bg-dark text-white"><option>Enabled</option></select></div>
                            <div class="col-md-12"><label class="small text-muted fw-bold">WhatsApp Link</label><input type="text" class="form-control bg-dark text-white" value="https://chat.whatsapp.com/invite"></div>
                        </div>

                        <h5 class="fw-bold border-bottom pb-2">10-Level Referral Engine</h5>
                        <div class="row g-3 mb-4">
                            <div class="col-md-12"><label class="small text-muted fw-bold">Direct Reward (%)</label><input type="number" class="form-control bg-dark text-white" value="20"></div>
                            <div class="col-md-3"><label class="small text-muted fw-bold">Level 1 (%)</label><input type="number" class="form-control bg-dark text-white" value="5"></div>
                            <div class="col-md-3"><label class="small text-muted fw-bold">Level 2 (%)</label><input type="number" class="form-control bg-dark text-white" value="4"></div>
                            <div class="col-md-3"><label class="small text-muted fw-bold">Level 3 (%)</label><input type="number" class="form-control bg-dark text-white" value="3"></div>
                        </div>
                        <button class="btn btn-primary px-5 fw-bold">Save Settings</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
